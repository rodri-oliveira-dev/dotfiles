version: 2

updates:
  - package-ecosystem: "github-actions" # zizmor: ignore[dependabot-cooldown] Existing weekly cadence; cooldown policy is outside issue #15.
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
