name: Validate

on:
  push:
    branches:
      - main
    paths:
      - "install.sh"
      - "uninstall.sh"
      - "bin/**"
      - "shell/**"
      - "scripts/**"
      - ".githooks/**"
      - "tests/**"
      - "Dockerfile.test"
      - ".dockerignore"
      - ".editorconfig"
      - ".gitattributes"
      - ".gitleaks.toml"
      - ".hadolint.yaml"
      - ".github/workflows/validate.yml"
      - ".github/dependabot.yml"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shell:
    name: Shell validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install test and formatting tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes bats curl shellcheck shfmt

      - name: Install pinned security scanners
        shell: bash
        run: bash scripts/install-security-tools

      - name: Validate shell sources
        shell: bash
        run: bash scripts/validate-shell

      - name: Run security scans
        shell: bash
        run: bash scripts/security-scan

      - name: Run Bats tests
        shell: bash
        run: bats tests

  container:
    name: Clean container lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: shell

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and verify lifecycle test image
        shell: bash
        run: bash tests/docker-context.sh
