name: Validate

on:
  push:
    branches:
      - main
    paths:
      - "install.sh"
      - "uninstall.sh"
      - "bin/**"
      - "shell/**"
      - "tests/**"
      - ".editorconfig"
      - ".gitattributes"
      - ".github/workflows/validate.yml"
      - ".github/dependabot.yml"
  pull_request:
    paths:
      - "install.sh"
      - "uninstall.sh"
      - "bin/**"
      - "shell/**"
      - "tests/**"
      - ".editorconfig"
      - ".gitattributes"
      - ".github/workflows/validate.yml"
      - ".github/dependabot.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shell:
    name: Shell validation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install test and formatting tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes bats shfmt

      - name: Validate Bash syntax
        shell: bash
        run: |
          bash -n install.sh
          bash -n uninstall.sh
          bash -n bin/*
          bash -n shell/*.sh
          bash -n tests/test_helper.bash

      - name: Run ShellCheck
        shell: bash
        run: |
          shellcheck install.sh
          shellcheck uninstall.sh
          shellcheck bin/*
          shellcheck shell/*.sh
          shellcheck tests/test_helper.bash

      - name: Check shell formatting
        shell: bash
        run: |
          shfmt -d -i 2 install.sh uninstall.sh bin/* shell/*.sh tests/test_helper.bash

      - name: Run Bats tests
        shell: bash
        run: bats tests
