name: Validate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    name: Shell validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install test and formatting tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes bats shfmt

      - name: Validate Bash syntax
        shell: bash
        run: |
          bash -n install.sh
          bash -n uninstall.sh
          bash -n bin/*
          bash -n shell/*.sh
          bash -n tests/test_helper.bash

      - name: Run ShellCheck
        shell: bash
        run: |
          shellcheck install.sh
          shellcheck uninstall.sh
          shellcheck bin/*
          shellcheck shell/*.sh
          shellcheck tests/test_helper.bash

      - name: Check shell formatting
        shell: bash
        run: |
          shfmt -d -i 2 install.sh uninstall.sh bin/* shell/*.sh tests/test_helper.bash

      - name: Run Bats tests
        shell: bash
        run: bats tests
